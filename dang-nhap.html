<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Trang đăng nhập hệ thống quản lý câu lạc bộ ClubManager.">
    <title>Đăng nhập | ClubManager</title>
</head>

<body>

    <main>
        <section>
            <h1>ClubManager</h1>

            <p>Hệ thống quản lý câu lạc bộ</p>

            <form action="index.html" method="get">

                <div>
                    <label for="ten-dang-nhap">Tên đăng nhập</label>
                    <input
                        type="text"
                        id="ten-dang-nhap"
                        name="ten-dang-nhap"
                        required
                    >
                </div>

                <div>
                    <label for="mat-khau">Mật khẩu</label>
                    <input
                        type="password"
                        id="mat-khau"
                        name="mat-khau"
                        required
                    >
                </div>

                <div>
                    <input
                        type="checkbox"
                        id="ghi-nho"
                        name="ghi-nho"
                    >
                    <label for="ghi-nho">Ghi nhớ đăng nhập</label>
                </div>

                <button type="submit">Đăng nhập</button>

            </form>
        </section>
    </main>

</body>

</html>
